name: CI

on:
  push:
    branches: [ feature/slack-task ]
  pull_request:
    branches: [ feature/slack-task ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Run ruff
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest
