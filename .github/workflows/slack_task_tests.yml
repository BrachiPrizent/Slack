name: Tests

on:
  push:
    branches: [ feature/slack-task ]
  pull_request:
    branches: [ feature/slack-task ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r my_slack/requirements.txt

      - name: Run tests
        run: |
          pytest my_slack/tests
